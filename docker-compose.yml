networks:
  sih_network:
    driver: bridge
services:
  backend-case-management:
    build:
      context: .
      dockerfile: cloud-devops/docker/backend-case.Dockerfile
    environment:
    - DATABASE_URL=sqlite:///./data/sih26102.db
    - JWT_SECRET=super_secret_key_123
    ports:
    - 8004:8000
    restart: always
    volumes:
    - ./backend-case-management:/app
    - ./backend-data-api/data:/app/data
    - ./backend-data-api/uploads:/app/uploads
  backend-data-api:
    build:
      context: .
      dockerfile: cloud-devops/docker/backend-data.Dockerfile
    container_name: sih26102-backend-data-api
    depends_on:
    - postgres
    - ml-engine
    env_file:
    - .env
    environment:
    - ML_ENGINE_URL=http://ml-engine:8000
    networks:
    - sih_network
    ports:
    - 8001:8000
  frontend-dashboard:
    build:
      args:
      - VITE_USE_MOCK=false
      - VITE_API_BASE_URL=/
      context: .
      dockerfile: cloud-devops/docker/frontend.Dockerfile
    container_name: sih26102-frontend-dashboard
    networks:
    - sih_network
    ports:
    - 3000:80
  ml-engine:
    build:
      context: .
      dockerfile: cloud-devops/docker/ml.Dockerfile
    container_name: sih26102-ml-engine
    env_file:
    - .env
    networks:
    - sih_network
    ports:
    - 8003:8000
  nginx:
    container_name: sih26102-nginx
    depends_on:
    - frontend-dashboard
    - backend-data-api
    - ml-engine
    image: nginx:latest
    networks:
    - sih_network
    ports:
    - 8080:80
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  postgres:
    container_name: sih26102-postgres
    environment:
      POSTGRES_DB: sih26102_db
      POSTGRES_PASSWORD: sih26102pass
      POSTGRES_USER: sih26102
    image: postgres:16-alpine
    networks:
    - sih_network
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./data-pipeline/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
volumes:
  postgres_data: null
