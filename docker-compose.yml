services:
  postgres:
    image: postgres:16-alpine
    container_name: sih26102-postgres
    environment:
      POSTGRES_USER: sih26102
      POSTGRES_PASSWORD: sih26102pass
      POSTGRES_DB: sih26102_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data-pipeline/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - sih_network

  ml-engine:
    build:
      context: .
      dockerfile: cloud-devops/docker/ml.Dockerfile
    ports:
      - "8003:8000"
    container_name: sih26102-ml-engine
    env_file:
      - .env
    networks:
      - sih_network

  backend-case-management:
    build:
      context: .
      dockerfile: cloud-devops/docker/backend-case.Dockerfile
    ports:
      - "8002:8000"
    container_name: sih26102-backend-case-management
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - sih_network

  backend-data-api:
    build:
      context: .
      dockerfile: cloud-devops/docker/backend-data.Dockerfile
    ports:
      - "8001:8000"
    container_name: sih26102-backend-data-api
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - sih_network

  frontend-dashboard:
    build:
      context: .
      dockerfile: cloud-devops/docker/frontend.Dockerfile
      args:
        - VITE_USE_MOCK=false
        - VITE_API_BASE_URL=/
    ports:
      - "3000:80"
    container_name: sih26102-frontend-dashboard
    networks:
      - sih_network

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    container_name: sih26102-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-dashboard
      - backend-case-management
      - backend-data-api
      - ml-engine
    networks:
      - sih_network

networks:
  sih_network:
    driver: bridge

volumes:
  postgres_data: