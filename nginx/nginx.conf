events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # 1. Frontend Dashboard (Chandana)
        location / {
            proxy_pass http://frontend-dashboard:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Auth API (Poornesh)
        location /auth/ {
            proxy_pass http://backend-case-management:8000/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Case Management API (Poornesh)
        location /api/cases/ {
            proxy_pass http://backend-case-management:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Data API (Mokshagna)
        location /api/data/ {
            proxy_pass http://backend-data-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 5. ML Engine API (Kousic)
        location /api/ml/ {
            proxy_pass http://ml-engine:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}