name: CI - Build & Test ML Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test-ml-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ml-engine Docker image
        run: docker build -f cloud-devops/docker/ml.Dockerfile -t sih26102-ml-engine .

      - name: Run container
        run: docker run -d -p 8080:8000 --name ml-engine-test sih26102-ml-engine

      - name: Wait for service to start
        run: sleep 5

      - name: Smoke test health endpoint
        run: |
          curl -f http://localhost:8080/ || (docker logs ml-engine-test && exit 1)

      - name: Stop container
        if: always()
        run: docker rm -f ml-engine-test